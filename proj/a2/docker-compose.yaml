services:
  db:
    image: mariadb
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_DATABASE: mydatabase
      MYSQL_USER: user
      MYSQL_PASSWORD: password
    ports:
      - "3306:3306"

  api:
    build:
        context: ./api/
    container_name: api-backend
    depends_on:
      - db
    ports:
      - 8000:8000

  web:
    container_name: web-frontend
    environment:
      REACT_APP_API_URL: "http://localhost:8000"
    build:
      context: ./web/
    ports:
      - 3000:3000
    stdin_open: true
